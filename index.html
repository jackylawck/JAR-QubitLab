<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 
      Project: J.A.R. QubitLab (Joint Applied Research)
      Creator: 羅子淇 Jacky Law
      Profile: https://jackylawck.github.io/jackylawck
    -->

    <!-- CSP: 嚴格且相容 Web Worker (R3F) 與 Web Audio -->
    <meta 
      http-equiv="Content-Security-Policy" 
      content="default-src 'self'; script-src 'self'; object-src 'none'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob:;" 
    />
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>" />
    
    <!-- 針對 iPhone 等行動裝置的沈浸式/PWA 體驗優化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#030712" />
    
    <title>J.A.R. QubitLab | 量子微觀實驗室</title>
  </head>
  
  <!-- touch-none 徹底封鎖 iOS Safari 的橡皮筋回彈與滑動返回手勢 -->
  <body class="bg-gray-950 text-gray-100 overflow-hidden select-none touch-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
