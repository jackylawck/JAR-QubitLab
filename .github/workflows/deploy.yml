name: Deploy QubitLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限以部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同一時間有多個部署競爭
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 🌟 優化 1：將 Build 與 Deploy 拆分為獨立的 Job (職責分離)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 🌟 優化 2：加入超時防護，避免進程卡死（如測試死迴圈）耗盡 Actions 額度

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Quantum Engine Unit Tests
        run: npx vitest run

      - name: 🏗️ Build Project (Vite)
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: 🛡️ Verify Build Security & Integrity
        env:
          GITHUB_ACTIONS: 'true'
        run: node scripts/verify-build.mjs

      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 🌟 優化 1：獨立的 Deploy Job
  deploy:
    needs: build # 🌟 優化 3：明確依賴，確保 Build 與 Tests 100% 通過後才啟動部署環境
    runs-on: ubuntu-latest
    
    # 🌟 優化 4：將 environment 移至 deploy job。這樣若設定了「人工審核部署」，就不會卡住前面的單元測試與建置
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
