# .github/workflows/deploy.yml
# Project: J.A.R. QubitLab (Joint Applied Research)
# Creator: 羅子淇 Jacky Law (https://jackylawck.github.io/jackylawck)

name: Deploy QubitLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設零權限（最小權限原則），僅於 deploy 階段按需授予 Pages 部署憑證
permissions: {}

# 依序排隊部署，避免中斷正在寫入的生產環境發布
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: 🧪 Run Quantum Engine Unit Tests
        run: npx vitest run

      - name: 🏗️ Build Project (Vite)
        env:
          NODE_ENV: production
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: 🛡️ Verify Build Security & Integrity
        env:
          GITHUB_ACTIONS: 'true'
        run: node scripts/verify-build.mjs

      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
